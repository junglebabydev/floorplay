# Floorimate MCP server on Cloudflare Workers (free plan is enough).
# Deploy: pnpm mcp:deploy  (or the "Deploy MCP server" GitHub Action)
name = "floorimate-mcp"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm build:mcp"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[observability]
enabled = true
