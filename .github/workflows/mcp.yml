name: Deploy MCP server

# Deploys the Floorimate MCP App (for ChatGPT and Claude connectors) to Cloudflare Workers.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers")
# and CLOUDFLARE_ACCOUNT_ID. Without them this workflow does nothing.

on:
  push:
    branches: [main]
    paths: ['mcp/**', 'src/core/**', 'src/three/**', 'src/app/**', 'src/ai/validate.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/mcp.yml']
  workflow_dispatch:

concurrency:
  group: mcp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the MCP server."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: pnpm/action-setup@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: env.HAS_TOKEN == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_TOKEN == 'true'
        run: pnpm test
      - if: env.HAS_TOKEN == 'true'
        run: pnpm mcp:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
